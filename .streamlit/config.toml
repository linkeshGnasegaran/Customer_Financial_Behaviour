[theme]
base = "light"
font = "sans serif"

[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"

[theme.light.sidebar]
backgroundColor = "#eff6ff"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"

[theme.dark]
primaryColor = "#38bdf8"
backgroundColor = "#020617"
secondaryBackgroundColor = "#0f172a"
textColor = "#f8fafc"

[theme.dark.sidebar]
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"